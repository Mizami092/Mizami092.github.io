<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070d16">
  <meta name="description" content="写给刘博雅的 3D ASCII 圣诞树：金色星光、像素飘雪与循环出现的悄悄话。">
  <title>刘博雅的像素圣诞树</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 80'%3E%3Crect width='80' height='80' rx='18' fill='%23070d16'/%3E%3Ctext x='40' y='57' text-anchor='middle' font-family='monospace' font-size='64' fill='%23edce88'%3E*%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <audio id="background-music" src="christmas-background.mp3" autoplay loop preload="auto" playsinline hidden></audio>
  <div class="ambient" aria-hidden="true"></div>
  <canvas id="scene" aria-label="居中的立体字符圣诞树从底部慢慢生长，金色灯带、星星和礼物随树旋转；密集的像素雪花以低帧率跳动。"></canvas>
  <div class="vignette" aria-hidden="true"></div>
  <main aria-labelledby="page-title">
    <h1 class="screen-reader" id="page-title">写给刘博雅的字符圣诞树</h1>
    <div class="secret" id="secret" aria-hidden="true">
      <div class="secret-message" id="secret-message"></div>
      <div class="secret-flourish"><span></span><i>*</i><span></span></div>
    </div>
    <p class="screen-reader" id="accessible-wish">刘博雅全世界最可爱</p>
    <div class="greeting"><span class="greeting-star">+</span><span>Merry Christmas</span><span class="greeting-star">+</span></div>
  </main>
  <noscript><p class="noscript">请启用 JavaScript，让这棵字符圣诞树为你亮起。</p></noscript>
</body>
</html>
